name: Docker Run
description: Run a command in a Docker image with phase-level timing and automatic cleanup
author: https://github.com/jameslnewell
requirements:
  - docker
configuration:
  properties:
    image:
      type: string
      description: "Docker image to run (required)"
    command:
      type:
        - string
        - array
      description: "Command to run in the container. Multiple items are joined with newlines and passed as a single script to the shell. A warning is emitted if not set and the step has a command."
    shell:
      type:
        - array
        - boolean
      description: "Shell used to wrap the command. Defaults to [\"/bin/sh\", \"-e\", \"-c\"]. Set to false to pass command items directly as docker args without a shell wrapper."
    workdir:
      type: string
      description: "Override working directory in the container"
    entrypoint:
      type: string
      description: "Override container entrypoint"
    environment:
      type: array
      description: "Environment variables as KEY or KEY=VALUE"
    volumes:
      type: array
      description: "Volume mounts as host:container. Relative host paths (starting with .) are resolved against pwd."
    propagate-docker:
      type: boolean
      description: "Mount the host Docker socket and a readable copy of the Docker config, enabling Docker-from-Docker without userns:host"
    propagate-ssh-agent:
      type: boolean
      description: "Forward the host SSH agent socket into the container at /run/ssh-agent and set SSH_AUTH_SOCK accordingly"
    propagate-aws:
      type: boolean
      description: "Propagate AWS credential and region env vars (AWS_REGION, AWS_DEFAULT_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN)"
    propagate-buildkite-agent:
      type: boolean
      description: "Mount the Buildkite agent socket and propagate BUILDKITE_AGENT_ACCESS_TOKEN so the container can run buildkite-agent commands"
  required:
    - image
  additionalProperties: false
