name: Docker Run
description: Run a command in a Docker image with phase-level timing and automatic cleanup
author: https://github.com/jameslnewell
requirements:
  - docker
configuration:
  properties:
    image:
      type: string
      description: "Docker image to run (required)"
    command:
      type: array
      description: "Argv to pass as the container CMD (no shell wrapper). Each array item is one token. Use the step's commands field for shell-wrapped execution."
    shell:
      type:
        - array
        - boolean
      description: "Shell used to wrap step commands. Defaults to [\"/bin/sh\", \"-e\", \"-c\"]. Set to false to pass BUILDKITE_COMMAND directly without a shell wrapper. Has no effect when the plugin 'command' option is used."
    workdir:
      type: string
      description: "Override working directory in the container (defaults to /workdir when mount-checkout is enabled)"
    entrypoint:
      type: string
      description: "Override container entrypoint. Any value (including \"\") suppresses shell wrapping for step commands, matching the official buildkite docker plugin. Use \"\" to clear the image's ENTRYPOINT while passing plugin command args directly."
    mount-checkout:
      type: boolean
      description: "Mount the agent checkout directory as the working directory inside the container (default: true). The effective workdir defaults to /workdir unless the workdir option is set."
    environment:
      type: array
      description: "Environment variables as KEY or KEY=VALUE"
    volumes:
      type: array
      description: "Volume mounts as host:container. Relative host paths (starting with .) are resolved against pwd."
    propagate-docker:
      type: boolean
      description: "Mount the host Docker socket and a readable copy of the Docker config, enabling Docker-from-Docker without userns:host"
    propagate-ssh-agent:
      type: boolean
      description: "Forward the host SSH agent socket into the container at /run/ssh-agent and set SSH_AUTH_SOCK accordingly. Also mounts the agent's ~/.ssh/known_hosts (when present) at /etc/ssh/ssh_known_hosts so git/ssh trusts known hosts instead of hanging on an interactive host-key prompt."
    propagate-aws:
      type: boolean
      description: "Propagate AWS credential and region env vars (AWS_REGION, AWS_DEFAULT_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN)"
    propagate-buildkite-agent:
      type: boolean
      description: "Mount the Buildkite agent socket and propagate BUILDKITE_AGENT_ACCESS_TOKEN so the container can run buildkite-agent commands"
    propagate-buildkite-environment:
      type: boolean
      description: "Propagate CI, BUILDKITE and all BUILDKITE_* env vars from the host into the container"
    hook:
      type: string
      enum: [command, pre-command]
      description: "Buildkite hook phase to run in. Defaults to command. Set to pre-command to run as setup before the main command hook (e.g. to pull secrets or write env files before a docker-compose-run step)."
  required:
    - image
  additionalProperties: false
