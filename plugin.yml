name: Docker Run
description: Run a command in a Docker image with phase-level timing and automatic cleanup
author: https://github.com/jameslnewell
requirements:
  - docker
configuration:
  properties:
    image:
      type: string
      description: "Docker image to run (required)"
    command:
      type:
        - string
        - array
      description: "Command to run in the container. A warning is emitted if not set and the step has a command."
    workdir:
      type: string
      description: "Override working directory in the container"
    entrypoint:
      type: string
      description: "Override container entrypoint"
    environment:
      type: array
      description: "Environment variables as KEY=VALUE"
    volumes:
      type: array
      description: "Volume mounts as host:container. Relative host paths (starting with .) are resolved against pwd."
    docker_from_docker:
      type: boolean
      description: "Mount the host Docker socket and a readable copy of the Docker config into the container, enabling Docker-from-Docker"
  required:
    - image
  additionalProperties: false
