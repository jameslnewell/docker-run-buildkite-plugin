name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format. Use v1.2.3"
            exit 1
          fi

      - name: Create or verify git tag
        run: |
          VERSION="${{ inputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            TAGGED_COMMIT=$(git rev-parse "$VERSION")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAGGED_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $VERSION already exists and points to $TAGGED_COMMIT, not HEAD ($HEAD_COMMIT)"
              exit 1
            fi
            echo "Tag $VERSION already points to HEAD — skipping tag creation"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "CHANGELOG<<EOF"
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${{ inputs.version }}$" | head -1 || echo "")
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release"
              git log --pretty=format:"- %s (%h)"
            else
              git log --pretty=format:"- %s (%h)" "$PREV_TAG".."${{ inputs.version }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        run: |
          gh release create "${{ inputs.version }}" \
            --title "${{ inputs.version }}" \
            --notes "${{ steps.changelog.outputs.CHANGELOG }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
